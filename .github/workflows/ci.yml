name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Install · Lint · Type-check · Test · Build · Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Bootstrap dependencies and lockfile
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-bootstrap
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
