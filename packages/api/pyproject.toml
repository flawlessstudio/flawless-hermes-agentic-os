[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-api"
version = "0.1.0"
description = "Hermes API — FastAPI backend with SSE streaming and health endpoints"
requires-python = ">=3.12"
license = { file = "../../LICENSE.md" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.0",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "hermes-core",
    "hermes-memory",
    "hermes-orchestrator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_api"]
