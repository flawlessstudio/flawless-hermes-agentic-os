[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-core"
version = "0.1.0"
description = "Hermes Core — atomic SQLite state store with WAL, file-locking, and checkpoint/rollback"
requires-python = ">=3.12"
license = { file = "../../LICENSE.md" }
dependencies = [
    "structlog>=24.0",
    "filelock>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_core"]

[tool.hatch.metadata]
allow-direct-references = true
