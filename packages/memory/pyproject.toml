[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-memory"
version = "0.1.0"
description = "Hermes Memory — vector (ChromaDB) + graph (SQLite) memory layer"
requires-python = ">=3.12"
license = { file = "../../LICENSE.md" }
dependencies = [
    "chromadb>=0.5",
    "pydantic>=2.8",
    "structlog>=24.0",
    "hermes-core",
]

[tool.uv.sources]
hermes-core = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_memory"]
