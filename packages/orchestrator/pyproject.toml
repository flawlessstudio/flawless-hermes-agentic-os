[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-orchestrator"
version = "0.1.0"
description = "Hermes Orchestrator — agent bus, sandbox enforcement, and registry"
requires-python = ">=3.12"
license = { file = "../../LICENSE.md" }
dependencies = [
    "anthropic>=0.34",
    "pydantic>=2.8",
    "structlog>=24.0",
    "hermes-core",
    "hermes-memory",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_orchestrator"]
