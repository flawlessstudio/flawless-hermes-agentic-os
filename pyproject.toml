[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-agentic-os"
version = "0.1.0"
description = "A minimal, dependency-free kernel for building Claude-powered agents"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[tool.setuptools]
packages = ["hermes"]
