[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[project]
name = "flawless-hermes-agentic-os"
version = "0.1.0"
description = "Flawless Hermes Agent OS — a SOTA local-first multi-agent operating system"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Flawless Studio", email = "oneflawlessstudio@gmail.com" }]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/memory",
    "packages/orchestrator",
    "packages/api",
]

[tool.uv.sources]
hermes-core = { workspace = true }
hermes-memory = { workspace = true }
hermes-orchestrator = { workspace = true }
hermes-api = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "agents"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "ANN",      # flake8-annotations
    "S",        # bandit security
    "RUF",      # Ruff-specific
]
ignore = [
    # Deprecated ANN rules
    "ANN401",  # Any is needed for dynamic tool kwargs
    # Type-checking imports: we prefer runtime imports for clarity
    "TC001", "TC002", "TC003",
    # Naming: SandboxViolation is domain-specific (not an Error)
    "N818",
    # StrEnum: UP042 requires Python 3.11+, we support 3.12 but keep explicit
    "UP042",
    # Security false-positives in internal code
    "S101",  # assert in tests
]

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/*" = ["S", "ANN", "F841"]
"agents/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "packages/memory/tests", "packages/orchestrator/tests", "packages/api/tests"]
addopts = ["--tb=short", "-q", "--import-mode=importlib"]

