[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flawless-hermes-agentic-os"
version = "0.1.0"
description = "Flawless Hermes Agent OS — a SOTA local-first multi-agent operating system"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Flawless Studio", email = "oneflawlessstudio@gmail.com" }]

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/memory",
    "packages/orchestrator",
    "packages/api",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src", "agents"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "TCH",      # flake8-type-checking
    "ANN",      # flake8-annotations
    "S",        # bandit security
    "RUF",      # Ruff-specific
]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests", "agents"]
addopts = ["--tb=short", "-q"]
